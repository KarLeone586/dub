<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#120e10">
<title>Колесо фортуны</title>

<style>
*{box-sizing:border-box}

html{
  color-scheme:dark
}

body{
  margin:0;
  min-height:100svh;
  background:
    radial-gradient(circle at 50% 8%,#3b2025 0,#171113 45%,#090808 100%);
  color:#ead7ad;
  font-family:Georgia,"Times New Roman",serif;
  display:grid;
  place-items:center
}

.page{
  width:min(100%,820px);
  padding:30px 16px 42px;
  text-align:center
}

.eyebrow{
  color:#c99d55;
  font:700 12px Arial,sans-serif;
  letter-spacing:4px;
  text-transform:uppercase
}

.eyebrow:before,
.eyebrow:after{
  content:"◆";
  color:#8c652e;
  margin:0 13px;
  font-size:9px
}

h1{
  margin:14px 0 12px;
  color:#e6c47a;
  font-size:clamp(38px,8vw,68px);
  line-height:1;
  text-shadow:0 3px 0 #35181d,0 12px 28px #000
}

.sub{
  margin:0 0 30px;
  color:#bca990;
  font:16px Arial,sans-serif
}

.wheel-wrap{
  position:relative;
  width:min(100%,650px);
  margin:auto;
  padding:19px;
  border:7px solid #9b682c;
  border-radius:50%;
  background:#191112;
  box-shadow:
    0 0 0 2px #e2bc6b,
    0 0 0 9px #3f2023,
    0 22px 55px #000
}

.wheel-wrap:before{
  content:"FORTUNE  •  DUBROVKA  •  FORTUNE";
  position:absolute;
  inset:-31px;
  display:grid;
  place-items:center;
  color:#b58a47;
  font:700 11px Arial,sans-serif;
  letter-spacing:3px;
  pointer-events:none
}

.pointer{
  position:absolute;
  z-index:5;
  top:-7px;
  left:calc(50% - 18px);
  width:0;
  height:0;
  border-left:18px solid transparent;
  border-right:18px solid transparent;
  border-top:45px solid #e7c477;
  filter:drop-shadow(0 5px 4px #000)
}

canvas{
  display:block;
  width:100%;
  height:auto;
  border-radius:50%;
  background:#171112;
  transform:translateZ(0);
  will-change:transform;
  transition:transform 4.2s cubic-bezier(.12,.75,.18,1)
}

.result{
  min-height:45px;
  margin:24px 0 13px;
  color:#e5c47d;
  font:26px Georgia,serif
}

.prizes{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:8px;
  max-width:650px;
  margin:0 auto 22px
}

.prizes span{
  padding:8px 13px;
  border:1px solid #765629;
  border-radius:3px;
  background:#171112;
  color:#cbb27d;
  font:13px Arial,sans-serif
}

button{
  width:min(100%,480px);
  min-height:60px;
  border:1px solid #d3aa61;
  border-radius:3px;
  background:linear-gradient(#6b382d,#38191f);
  color:#eddbaf;
  font:700 19px Georgia,serif;
  box-shadow:
    0 4px 0 #211014,
    0 12px 25px #0009;
  cursor:pointer
}

button:disabled{
  opacity:.55;
  cursor:default
}

@media(max-width:600px){
  .page{
    padding-top:28px
  }

  .wheel-wrap{
    padding:11px;
    border-width:5px
  }

  .wheel-wrap:before{
    inset:-23px;
    font-size:8px;
    letter-spacing:2px
  }

  .result{
    font-size:22px
  }
}
</style>
</head>

<body>
<main class="page">
  <div class="eyebrow">Дубровка Hookah & Lounge</div>

  <h1>Колесо фортуны</h1>

  <p class="sub">Пусть удача выберет ваш подарок</p>

  <div class="wheel-wrap">
    <div class="pointer"></div>
    <canvas id="wheel" width="900" height="900"></canvas>
  </div>

  <div id="result" class="result">
    Ваш счастливый приз ждёт вас
  </div>

  <div class="prizes" aria-label="Призы">
    <span>Десерт</span>
    <span>Дымный коктейль</span>
    <span>Чай</span>
    <span>10% скидка</span>
    <span>Ассорти закусок</span>
    <span>Лимонад</span>
    <span>Сет настоек</span>
    <span>20% скидка</span>
  </div>

  <button id="spin">Проверяем доступ…</button>
</main>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<script>
const prizes=[
  "Десерт",
  "Дымный коктейль",
  "Чай",
  "10% скидка",
  "Ассорти закусок",
  "Лимонад",
  "Сет настоек",
  "20% скидка"
];

const colors=[
  "#171313",
  "#681f2a",
  "#171313",
  "#681f2a",
  "#171313",
  "#681f2a",
  "#171313",
  "#681f2a"
];

const canvas=document.querySelector("#wheel");
const ctx=canvas.getContext("2d");
const button=document.querySelector("#spin");
const result=document.querySelector("#result");

let angle=0;
let busy=false;

prizes.forEach((prize,index)=>{
  const start=-Math.PI/2+index*2*Math.PI/prizes.length;
  const end=start+2*Math.PI/prizes.length;

  ctx.beginPath();
  ctx.moveTo(450,450);
  ctx.arc(450,450,430,start,end);
  ctx.fillStyle=colors[index];
  ctx.fill();

  ctx.strokeStyle="#dfbd70";
  ctx.lineWidth=5;
  ctx.stroke();

  ctx.save();
  ctx.translate(450,450);
  ctx.rotate((start+end)/2);
  ctx.translate(285,0);
  ctx.rotate(Math.PI/2);

  ctx.fillStyle="#f0dfba";
  ctx.font="700 "+(prize.length>13?"24":"30")+"px Georgia";
  ctx.textAlign="center";
  ctx.textBaseline="middle";
  ctx.fillText(prize,0,0);

  ctx.restore();
});

ctx.beginPath();
ctx.arc(450,450,78,0,Math.PI*2);
ctx.fillStyle="#120e10";
ctx.fill();

ctx.strokeStyle="#dfbd70";
ctx.lineWidth=7;
ctx.stroke();

ctx.fillStyle="#dfbd70";
ctx.font="700 29px Georgia";
ctx.textAlign="center";
ctx.textBaseline="middle";
ctx.fillText("FORTUNE",450,450);

const telegram=window.Telegram?.WebApp;
const initData=telegram?.initData||"";

async function request(path,extra={}){
  const controller=new AbortController();

  const timeout=setTimeout(()=>{
    controller.abort();
  },12000);

  try{
    const response=await fetch(path,{
      method:"POST",
      headers:{
        "Content-Type":"application/json"
      },
      body:JSON.stringify({
        initData,
        ...extra
      }),
      signal:controller.signal
    });

    const data=await response.json();

    if(!response.ok){
      throw new Error(data.error||"Ошибка сервера");
    }

    return data;
  }finally{
    clearTimeout(timeout);
  }
}

function showUsed(data){
  result.textContent="Ваш приз: "+data.prize;
  button.disabled=true;
  button.textContent="Прокрут использован";

  canvas.style.transform=
    "rotate("+
    (360-(data.index+.5)*360/prizes.length)+
    "deg)";
}

async function load(){
  if(!initData){
    result.textContent="Откройте колесо через Telegram-бота";
    button.textContent="Открыть бота";
    button.disabled=false;

    button.onclick=()=>{
      location.href="https://t.me/Dubrovka86_bot";
    };

    return;
  }

  try{
    const data=await request("/api/status");

    if(data.used){
      showUsed(data);
    }else{
      button.disabled=false;
      button.textContent="Крутить колесо";
      button.onclick=spin;
    }
  }catch(error){
    result.textContent=
      error.name==="AbortError"
        ? "Сервер отвечает слишком долго. Попробуйте ещё раз."
        : "Не удалось загрузить колесо. Попробуйте ещё раз.";

    button.textContent="Повторить";
    button.disabled=false;
    button.onclick=load;
  }
}

async function spin(){
  if(busy)return;

  busy=true;
  button.disabled=true;
  button.textContent="Колесо вращается…";

  try{
    const data=await request("/api/spin",{
      requestId:crypto.randomUUID()
    });

    if(data.alreadyUsed){
      showUsed(data);
      return;
    }

    const target=
      360-
      (data.index+.5)*360/prizes.length;

    const current=angle%360;
    const extra=(target-current+360)%360;

    angle+=1800+extra;

    canvas.style.transform="rotate("+angle+"deg)";

    await new Promise(resolve=>{
      setTimeout(resolve,4300);
    });

    result.textContent="Ваш приз: "+data.prize;
    button.textContent="Прокрут использован";

    await request("/api/notify").catch(()=>{
      // Уведомление необязательно для работы колеса
    });
  }catch(error){
    result.textContent=
      error.name==="AbortError"
        ? "Сервер отвечает слишком долго. Попробуйте ещё раз."
        : "Не удалось завершить вращение. Попробуйте ещё раз.";

    button.textContent="Повторить";
    button.disabled=false;
    button.onclick=load;
  }finally{
    busy=false;
  }
}

if(telegram){
  telegram.ready();
  telegram.expand();
}

load();
</script>
</body>
</html>
