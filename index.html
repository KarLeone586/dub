<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#171112">
<title>Колесо фортуны</title>

<style>
*{box-sizing:border-box}
html{color-scheme:dark}

body{
  margin:0;
  min-height:100svh;
  background:
    radial-gradient(circle at 50% 12%,#4a2528 0,#211719 38%,#0c0a0a 100%);
  color:#f3e4c5;
  font:16px system-ui,sans-serif;
  display:grid;
  place-items:center
}

.page{
  width:min(100%,780px);
  padding:26px 16px 38px;
  text-align:center
}

.eyebrow{
  color:#cba366;
  letter-spacing:3px;
  font-size:11px;
  text-transform:uppercase
}

.eyebrow:before,
.eyebrow:after{
  content:'✦';
  margin:0 10px;
  color:#9a7038
}

h1{
  margin:12px 0 20px;
  font:700 clamp(36px,8vw,64px)/1 Georgia,serif;
  color:#e8c477;
  text-shadow:0 3px #351b20,0 10px 30px #000
}

.sub{
  color:#cbb79b;
  margin:0 auto 22px
}

.wheel-wrap{
  position:relative;
  width:min(100%,620px);
  margin:auto;
  padding:18px;
  border:8px solid #9e6b30;
  border-radius:50%;
  background:#251718;
  box-shadow:
    0 0 0 3px #dcb66a,
    0 0 0 10px #3d1c21,
    0 20px 55px #000b
}

.wheel-wrap:before{
  content:'♠  ♦  FORTUNE  ♣  ♥';
  position:absolute;
  inset:-29px;
  display:grid;
  place-items:center;
  color:#cda961;
  font:700 12px Georgia;
  letter-spacing:3px;
  pointer-events:none
}

.pointer{
  position:absolute;
  z-index:3;
  top:-5px;
  left:calc(50% - 17px);
  border-left:17px solid transparent;
  border-right:17px solid transparent;
  border-top:42px solid #e4c176;
  filter:drop-shadow(0 4px 3px #000)
}

canvas{
  display:block;
  width:100%;
  height:auto;
  border-radius:50%;
  background:#171112;
  will-change:transform;
  transform:translateZ(0);
  transition:transform 4s cubic-bezier(.12,.75,.18,1)
}

.result{
  min-height:48px;
  margin:22px 0 12px;
  font-size:clamp(20px,4vw,28px);
  color:#ecd094
}

.prizes{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:7px;
  margin:0 auto 18px;
  max-width:620px
}

.prizes span{
  padding:7px 11px;
  border:1px solid #806035;
  border-radius:999px;
  background:#211617;
  color:#d8bd86;
  font-size:13px
}

button{
  width:min(100%,480px);
  min-height:60px;
  border:2px solid #d8b36a;
  border-radius:10px;
  background:linear-gradient(#713c2d,#421b22);
  color:#f5e5c2;
  font:700 19px Georgia;
  box-shadow:0 5px 0 #271016,0 12px 25px #0008;
  cursor:pointer
}

button:disabled{
  opacity:.55;
  cursor:default
}

@media(max-width:600px){
  .page{padding-top:28px}

  .wheel-wrap{
    padding:10px;
    border-width:5px
  }

  .wheel-wrap:before{
    inset:-22px;
    font-size:9px
  }
}
</style>
</head>

<body>
<main class="page">
  <div class="eyebrow">Дубровка Hookah & Lounge</div>

  <h1>Колесо фортуны</h1>

  <p class="sub">Пусть удача выберет ваш подарок</p>

  <div class="wheel-wrap">
    <div class="pointer"></div>
    <canvas id="wheel" width="900" height="900"></canvas>
  </div>

  <div id="result" class="result">
    Ваш счастливый приз ждёт вас
  </div>

  <div class="prizes" aria-label="Призы">
    <span>Десерт</span>
    <span>Дымный коктейль</span>
    <span>Чай</span>
    <span>10% скидка</span>
    <span>Ассорти закусок</span>
    <span>Лимонад</span>
    <span>Сет настоек</span>
    <span>20% скидка</span>
  </div>

  <button id="spin">Проверяем доступ…</button>
</main>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<script>
const prizes=[
  'Десерт',
  'Дымный коктейль',
  'Чай',
  '10% скидка',
  'Ассорти закусок',
  'Лимонад',
  'Сет настоек',
  '20% скидка'
];

const colors=[
  '#241b1b',
  '#5a2028',
  '#2b2221',
  '#6b2b2f',
  '#201a19',
  '#512026',
  '#302322',
  '#64272d'
];

const canvas=document.querySelector('#wheel');
const ctx=canvas.getContext('2d');
const button=document.querySelector('#spin');
const result=document.querySelector('#result');

let angle=0;
let busy=false;

prizes.forEach((prize,index)=>{
  const start=-Math.PI/2+index*2*Math.PI/prizes.length;
  const end=start+2*Math.PI/prizes.length;

  ctx.beginPath();
  ctx.moveTo(450,450);
  ctx.arc(450,450,430,start,end);
  ctx.fillStyle=colors[index];
  ctx.fill();

  ctx.strokeStyle='#d7b66c';
  ctx.lineWidth=4;
  ctx.stroke();

  ctx.save();
  ctx.translate(450,450);
  ctx.rotate((start+end)/2);
  ctx.translate(285,0);
  ctx.rotate(Math.PI/2);

  ctx.fillStyle='#f1dfb8';
  ctx.font='700 '+(prize.length>13?'25':'31')+'px Georgia';
  ctx.textAlign='center';
  ctx.textBaseline='middle';
  ctx.fillText(prize,0,0);

  ctx.restore();
});

ctx.beginPath();
ctx.arc(450,450,75,0,Math.PI*2);
ctx.fillStyle='#211416';
ctx.fill();

ctx.strokeStyle='#d9b66b';
ctx.lineWidth=6;
ctx.stroke();

ctx.fillStyle='#d9b66b';
ctx.font='34px Georgia';
ctx.textAlign='center';
ctx.fillText('★',450,462);

const telegram=window.Telegram?.WebApp;
const initData=telegram?.initData||'';

async function request(path,extra={}){
  const controller=new AbortController();

  const timer=setTimeout(()=>{
    controller.abort();
  },12000);

  try{
    const response=await fetch(path,{
      method:'POST',
      headers:{
        'Content-Type':'application/json'
      },
      body:JSON.stringify({
        initData,
        ...extra
      }),
      signal:controller.signal
    });

    const data=await response.json();

    if(!response.ok){
      throw Error(data.error||'Ошибка сервера');
    }

    return data;
  }finally{
    clearTimeout(timer);
  }
}

function showUsed(data){
  result.textContent='Ваш приз: '+data.prize;
  button.disabled=true;
  button.textContent='Прокрут использован';

  canvas.style.transform=
    'rotate('+
    (360-(data.index+.5)*360/prizes.length)+
    'deg)';
}

async function load(){
  if(!initData){
    result.textContent='Откройте колесо через Telegram-бота';
    button.textContent='Открыть бота';
    button.disabled=false;

    button.onclick=()=>{
      location.href='https://t.me/Dubrovka86_bot';
    };

    return;
  }

  try{
    const data=await request('/api/status');

    if(data.used){
      showUsed(data);
    }else{
      button.disabled=false;
      button.textContent='Крутить колесо';
      button.onclick=spin;
    }
  }catch(error){
    result.textContent=
      error.name==='AbortError'
        ? 'Сервер отвечает слишком долго. Попробуйте ещё раз.'
        : 'Не удалось загрузить колесо. Попробуйте ещё раз.';

    button.textContent='Повторить';
    button.disabled=false;
    button.onclick=load;
  }
}

async function spin(){
  if(busy)return;

  busy=true;
  button.disabled=true;
  button.textContent='Колесо вращается…';

  try{
    const data=await request('/api/spin',{
      requestId:crypto.randomUUID()
    });

    if(data.alreadyUsed){
      showUsed(data);
      return;
    }

    const target=
      360-
      (data.index+.5)*360/prizes.length;

    const current=angle%360;
    const extra=(target-current+360)%360;

    angle+=1800+extra;

    canvas.style.transform='rotate('+angle+'deg)';

    await new Promise(resolve=>{
      setTimeout(resolve,4100);
    });

    result.textContent='Ваш приз: '+data.prize;
    button.textContent='Прокрут использован';

    await request('/api/notify').catch(()=>{
      // уведомление необязательно для работы колеса
    });
  }catch(error){
    result.textContent=
      error.name==='AbortError'
        ? 'Сервер отвечает слишком долго. Попробуйте ещё раз.'
        : 'Не удалось завершить вращение. Попробуйте ещё раз.';

    button.textContent='Повторить';
    button.disabled=false;
    button.onclick=load;
  }finally{
    busy=false;
  }
}

if(telegram){
  telegram.ready();
  telegram.expand();
}

load();
</script>
</body>
</html>
