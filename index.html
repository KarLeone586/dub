<style>*{box-sizing:border-box}html{color-scheme:dark}body{margin:0;min-height:100svh;background:radial-gradient(ellipse at 50% 42%,#28171c 0, #101012 65%);color:#f5eeeb;font:18px system-ui,sans-serif;display:grid;place-items:center}main{width:min(100%,800px);padding:32px 24px 36px;text-align:center}.eyebrow{color:#d19b9e;letter-spacing:3px;font-size:12px;text-transform:uppercase}h1{font:clamp(36px,5vw,56px)/1.12 Georgia,serif;font-weight:400;margin:14px 0 32px}.wheel-wrap{position:relative;width:min(100%,620px,62svh);margin-inline:auto;padding:12px;border:1px solid #724149;border-radius:50%;background:#191416;box-shadow:0 0 90px #921c2420}.pointer{position:absolute;top:-7px;left:calc(50% - 15px);border-left:15px solid transparent;border-right:15px solid transparent;border-top:36px solid #efd4c8;z-index:2;filter:drop-shadow(0 3px 3px #0008)}canvas{display:block;width:100%;height:auto;transition:transform 4s cubic-bezier(.13,.65,.13,1)}#result{min-height:58px;display:grid;place-items:center;margin:22px 0 14px;font-size:clamp(20px,2.5vw,26px);line-height:1.4;overflow-wrap:anywhere}button{width:100%;max-width:480px;min-height:64px;background:#963f48;border:1px solid #b9656d;border-radius:16px;color:#fff4ef;padding:18px 24px;font:600 20px system-ui;cursor:pointer;touch-action:manipulation;transition:background .2s}button:hover:enabled{background:#aa4a54}button:focus-visible{outline:3px solid #e9c9bc;outline-offset:5px}button:disabled{opacity:.6;cursor:default}@media(max-width:600px){main{padding: max(28px,env(safe-area-inset-top)) 12px max(28px,env(safe-area-inset-bottom))}.eyebrow{font-size:11px;letter-spacing:2.5px}h1{font-size:clamp(32px,9vw,46px);margin:14px 0 30px}.wheel-wrap{width:100%;max-width:480px;padding:8px}.pointer{border-left-width:12px;border-right-width:12px;border-top-width:30px;left:calc(50% - 12px)}#result{margin:20px 8px 14px;min-height:56px}button{width:calc(100% - 16px);min-height:62px;font-size:19px}}@media(max-height:520px) and (min-width:601px){main{padding-block:24px}.wheel-wrap{width:360px}h1{font-size:36px}}@media(prefers-reduced-motion:reduce){canvas{transition-duration:.05s}}</style>
<style>
body{background:radial-gradient(circle at 18% 15%,#a83245 0,transparent 35%),radial-gradient(circle at 85% 80%,#69717a 0,transparent 36%),linear-gradient(145deg,#25282d,#6d2735 55%,#17191d)}
.eyebrow{color:#ffd6dc;font-weight:800;text-shadow:0 2px 12px #160b0e}.eyebrow::before{content:'✦ '}.eyebrow::after{content:' ✦'}h1{font-weight:700;text-shadow:0 4px 0 #8d2638,0 8px 24px #0008}.wheel-wrap{border:8px solid #d8dde2;background:#454b52;box-shadow:0 0 0 5px #fff3,0 0 0 12px #b52f49,0 12px 45px #0008;position:relative;z-index:2}button{background:linear-gradient(135deg,#d83b58,#7d8792);border:3px solid #fff;border-radius:999px;box-shadow:0 7px 0 #651d2b,0 12px 24px #0008}button:hover:enabled{filter:brightness(1.15);transform:translateY(-2px)}button:active:enabled{transform:translateY(3px);box-shadow:0 3px 0 #651d2b}.cat-stage{position:absolute;inset:0;z-index:4;pointer-events:none}.cat-mascot{position:absolute;left:-150px;top:250px;width:250px;max-height:190px;object-fit:contain;filter:drop-shadow(0 10px 10px #0009);transform-origin:62% 58%}.cat-mascot.spinning{animation:catPawSpin .7s ease-in-out infinite}@keyframes catPawSpin{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(8deg)}}
</style>
<style>
.wheel-wrap.winner{animation:wheelWin .7s ease-in-out 2;box-shadow:0 0 0 7px #fff8,0 0 0 15px #e04a62,0 0 55px #ffb0bb}
@keyframes wheelWin{50%{transform:scale(1.045)}}
.win-overlay{position:fixed;inset:0;display:grid;place-items:center;padding:20px;background:#160d10b8;backdrop-filter:blur(6px);z-index:20;opacity:0;pointer-events:none;transition:opacity .25s}
.win-overlay.open{opacity:1;pointer-events:auto}.win-card{width:min(100%,440px);padding:30px 24px;border:2px solid #f3b1bb;border-radius:28px;background:linear-gradient(145deg,#7e2538,#30353b);box-shadow:0 20px 60px #000b;text-align:center;transform:translateY(18px) scale(.94);transition:transform .3s}.win-overlay.open .win-card{transform:none}.win-kicker{color:#ffd6dc;font-size:14px;font-weight:800;letter-spacing:2px;text-transform:uppercase}.win-card h2{margin:9px 0 10px;font-size:clamp(28px,7vw,42px);color:#fff}.win-prize{margin:0 0 22px;font-size:clamp(23px,5vw,32px);font-weight:800;color:#ffe1a8}.win-close{max-width:100%;min-height:52px;padding:12px 24px;font-size:17px}
@media(max-width:600px){.cat-mascot{left:-78px;top:205px;width:170px;max-height:135px}.cat-stage{inset:0}.wheel-wrap{margin-top:8px}.win-card{padding:26px 18px}}
.brand-logo{display:block;width:min(82vw,300px);height:auto;max-height:112px;object-fit:contain;margin:0 auto 16px;border:1px solid #b52f49;border-radius:8px;box-shadow:0 8px 24px #0006}
@media(max-width:600px){.brand-logo{width:min(86vw,260px);max-height:82px;margin-bottom:12px}}
</style>

крут использован';result.textContent='Ваш приз: '+data.prize;canvas.style.transform='rotate('+(360-(data.index+.5)*360/prizes.length)+'deg)'}async function load(){button.disabled=true;try{const data=await request('/api/status');if(data.used){showUsed(data);await request('/api/notify').catch(()=>{});}else{result.textContent='Испытайте удачу';button.textContent='Крутить колесо';button.onclick=spin;button.disabled=false}}catch(error){result.textContent=error.message;button.textContent='Проверить доступ';button.disabled=false;button.onclick=load;}}async function spin(){if(busy)return;busy=true;document.querySelector('.cat-mascot')?.classList.add('spinning');button.disabled=true;button.textContent='Колесо вращается…';try{const data=await request('/api/spin',{requestId:crypto.randomUUID()});if(data.alreadyUsed){showUsed(data);busy=false;return}rotation+=1800+(360-(data.index+.5)*360/prizes.length-rotation%360+360)%360;canvas.style.transform='rotate('+rotation+'deg)';result.textContent='Выбираем ваш подарок…';await new Promise(resolve=>setTimeout(resolve,matchMedia('(prefers-reduced-motion: reduce)').matches?50:4100));result.textContent='Ваш приз: '+data.prize;button.textContent='Прокрут использован';if(data.credits>0){button.textContent='Крутить ещё · '+data.credits;button.disabled=false;}await request('/api/notify').catch(()=>{});}catch(error){result.textContent='Проверяем, сохранился ли результат…';await load();}finally{busy=false;document.querySelector('.cat-mascot')?.classList.remove('spinning');}}button.onclick=spin;if(!initData){result.textContent='Откройте колесо через Telegram-бота';button.textContent='Открыть бота';button.disabled=false;button.onclick=()=>location.href='https://t.me/Dubrovka86_bot';}else{tg.ready();tg.expand();load().then(()=>{if(!button.disabled)button.onclick=spin})}</script>
<script>
const winOverlay=document.querySelector('#winOverlay'),winPrize=document.querySelector('#winPrize'),winClose=document.querySelector('#winClose'),wheelWrap=document.querySelector('.wheel-wrap');
function celebrateWin(text){const prize=text.replace(/^Ваш приз:\s*/,'');if(!prize||!text.startsWith('Ваш приз:'))return;winPrize.textContent=prize;wheelWrap.classList.add('winner');winOverlay.classList.add('open');winClose.focus();}
new MutationObserver(()=>celebrateWin(document.querySelector('#result').textContent.trim())).observe(document.querySelector('#result'),{childList:true,characterData:true,subtree:true});
